name: Finalize Responsibility Review Aging

on:
  push:
    branches:
      - feat/responsibility-review-aging
    paths:
      - .github/workflows/finalize-responsibility-review-aging.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/responsibility-review-aging
          fetch-depth: 0
      - name: Finalize v0.3.25 Rust metadata
        shell: python
        run: |
          from pathlib import Path
          path = Path("src-tauri/src/lib.rs")
          source = path.read_text()
          old = "ci-watchtower/0.3.24"
          new = "ci-watchtower/0.3.25"
          if old not in source:
              if new not in source:
                  raise SystemExit("WatchTower user-agent version anchor missing")
          else:
              source = source.replace(old, new)
              path.write_text(source)
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit finalized Rust metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump WatchTower user agent to 0.3.25"
          git push origin HEAD:feat/responsibility-review-aging
