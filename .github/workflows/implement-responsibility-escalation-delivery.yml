name: Implement Responsibility Escalation Delivery
run-name: "[WT:ops] Implement Responsibility Escalation Delivery"

on:
  push:
    branches:
      - feat/responsibility-escalation-delivery
    paths:
      - .github/workflows/implement-responsibility-escalation-delivery.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/responsibility-escalation-delivery
          fetch-depth: 0
      - name: Apply delivery implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, got {count}")
              return text.replace(old, new, 1)

          lib_path = Path("src-tauri/src/lib.rs")
          lib = lib_path.read_text()
          lib = replace_once(lib, 'const RESPONSIBILITY_MAP_PATH: &str = "docs/ci/workflow-responsibility-map.json";', 'const RESPONSIBILITY_MAP_PATH: &str = "docs/ci/workflow-responsibility-map.json";\nconst RESPONSIBILITY_ESCALATION_MAX_ATTEMPTS: i64 = 3;', "delivery constant")

          lib = replace_once(lib, """    escalation_level: String,
              escalation_reason: Option<String>,
          }

          #[derive(Debug, Clone, Deserialize)]""", """    escalation_level: String,
              escalation_reason: Option<String>,
          }

          #[derive(Debug, Clone, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct ResponsibilityEscalationDelivery {
              id: i64,
              project_id: i64,
              repository_id: i64,
              repository: String,
              workflow_name: String,
              review_key: String,
              fingerprint: String,
              event_type: String,
              escalation_level: String,
              sla_status: String,
              reason: Option<String>,
              status: String,
              attempts: i64,
              last_error: Option<String>,
              first_attempt_at: String,
              last_attempt_at: String,
              emitted_at: Option<String>,
          }

          #[derive(Debug, Clone, Deserialize)]""", "delivery struct")

          lib = replace_once(lib, """        CREATE TABLE IF NOT EXISTS notifications_v2 (
                    track_id INTEGER NOT NULL REFERENCES watch_tracks(id) ON DELETE CASCADE,
                    run_id INTEGER NOT NULL,
                    run_attempt INTEGER NOT NULL,
                    event_type TEXT NOT NULL,
                    notified_at TEXT NOT NULL,
                    PRIMARY KEY(track_id, run_id, run_attempt, event_type)
                  );

                  CREATE TABLE IF NOT EXISTS app_settings (""", """        CREATE TABLE IF NOT EXISTS notifications_v2 (
                    track_id INTEGER NOT NULL REFERENCES watch_tracks(id) ON DELETE CASCADE,
                    run_id INTEGER NOT NULL,
                    run_attempt INTEGER NOT NULL,
                    event_type TEXT NOT NULL,
                    notified_at TEXT NOT NULL,
                    PRIMARY KEY(track_id, run_id, run_attempt, event_type)
                  );

                  CREATE TABLE IF NOT EXISTS responsibility_escalation_deliveries (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    review_key TEXT NOT NULL,
                    fingerprint TEXT NOT NULL,
                    project_id INTEGER NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                    repository_id INTEGER NOT NULL REFERENCES monitored_repositories(id) ON DELETE CASCADE,
                    workflow_name TEXT NOT NULL,
                    event_type TEXT NOT NULL CHECK(event_type IN ('warning','critical')),
                    escalation_level TEXT NOT NULL,
                    sla_status TEXT NOT NULL,
                    reason TEXT,
                    status TEXT NOT NULL CHECK(status IN ('pending','emitted','failed')),
                    attempts INTEGER NOT NULL DEFAULT 0,
                    last_error TEXT,
                    first_attempt_at TEXT NOT NULL,
                    last_attempt_at TEXT NOT NULL,
                    emitted_at TEXT,
                    UNIQUE(review_key, fingerprint, event_type)
                  );

                  CREATE INDEX IF NOT EXISTS idx_responsibility_escalation_delivery_scope
                    ON responsibility_escalation_deliveries(project_id, repository_id, last_attempt_at DESC);

                  CREATE TABLE IF NOT EXISTS app_settings (""", "delivery schema")

          lib = replace_once(lib, """    responsibility_map_drifts: Vec<ResponsibilityMapDrift>,
              responsibility_map_sources: Vec<ResponsibilityMapSourceStatus>,
              project_runs: Vec<WorkflowRunSummary>,""", """    responsibility_map_drifts: Vec<ResponsibilityMapDrift>,
              responsibility_map_sources: Vec<ResponsibilityMapSourceStatus>,
              responsibility_escalation_deliveries: Vec<ResponsibilityEscalationDelivery>,
              project_runs: Vec<WorkflowRunSummary>,""", "dashboard delivery field")

          lib = replace_once(lib, """    let responsibility_map_drifts = responsibility_map_drifts(&conn)?;
              let responsibility_map_sources = responsibility_map_source_statuses(&conn)?;
              let mut project_runs = Vec::new();""", """    let responsibility_map_drifts = responsibility_map_drifts(&conn)?;
              let responsibility_map_sources = responsibility_map_source_statuses(&conn)?;
              let responsibility_escalation_deliveries =
                  responsibility_escalation_deliveries(&conn, 50)?;
              let mut project_runs = Vec::new();""", "dashboard delivery load")

          lib = replace_once(lib, """        responsibility_map_drifts,
                  responsibility_map_sources,
                  project_runs,""", """        responsibility_map_drifts,
                  responsibility_map_sources,
                  responsibility_escalation_deliveries,
                  project_runs,""", "dashboard delivery value")

          lib = replace_once(lib, """fn send_notification(app: &AppHandle, title: &str, body: &str) {
              let _ = app.notification().builder().title(title).body(body).show();
          }

          fn notify_runs(""", """fn send_notification(app: &AppHandle, title: &str, body: &str) {
              let _ = app.notification().builder().title(title).body(body).show();
          }

          fn responsibility_escalation_event_type(level: &str) -> Option<&'static str> {
              match level {
                  "warning" => Some("warning"),
                  "critical" => Some("critical"),
                  _ => None,
              }
          }

          fn responsibility_source_synced(conn: &Connection, repository_id: i64) -> Result<bool> {
              let status: Option<String> = conn
                  .query_row(
                      "SELECT status FROM repository_responsibility_sources WHERE repository_id=?",
                      params![repository_id],
                      |row| row.get(0),
                  )
                  .optional()?;
              Ok(status.as_deref() == Some("synced"))
          }

          fn reserve_responsibility_escalation_delivery(
              conn: &Connection,
              drift: &ResponsibilityMapDrift,
              event_type: &str,
              now: &str,
          ) -> Result<bool> {
              let changed = conn.execute(
                  "INSERT INTO responsibility_escalation_deliveries(
                     review_key,fingerprint,project_id,repository_id,workflow_name,event_type,
                     escalation_level,sla_status,reason,status,attempts,last_error,
                     first_attempt_at,last_attempt_at,emitted_at
                   ) VALUES(?,?,?,?,?,?,?,?,?,'pending',1,NULL,?,?,NULL)
                   ON CONFLICT(review_key,fingerprint,event_type) DO UPDATE SET
                     project_id=excluded.project_id,
                     repository_id=excluded.repository_id,
                     workflow_name=excluded.workflow_name,
                     escalation_level=excluded.escalation_level,
                     sla_status=excluded.sla_status,
                     reason=excluded.reason,
                     status='pending',
                     attempts=responsibility_escalation_deliveries.attempts+1,
                     last_error=NULL,
                     last_attempt_at=excluded.last_attempt_at
                   WHERE responsibility_escalation_deliveries.status!='emitted'
                     AND responsibility_escalation_deliveries.attempts < ?",
                  params![
                      drift.review_key,
                      drift.fingerprint,
                      drift.project_id,
                      drift.repository_id,
                      drift.workflow_name,
                      event_type,
                      drift.escalation_level,
                      drift.sla_status,
                      drift.escalation_reason,
                      now,
                      now,
                      RESPONSIBILITY_ESCALATION_MAX_ATTEMPTS,
                  ],
              )?;
              Ok(changed > 0)
          }

          fn finish_responsibility_escalation_delivery(
              conn: &Connection,
              review_key: &str,
              fingerprint: &str,
              event_type: &str,
              now: &str,
              result: std::result::Result<(), String>,
          ) -> Result<()> {
              match result {
                  Ok(()) => {
                      conn.execute(
                          "UPDATE responsibility_escalation_deliveries
                           SET status='emitted',last_error=NULL,emitted_at=?,last_attempt_at=?
                           WHERE review_key=? AND fingerprint=? AND event_type=?",
                          params![now, now, review_key, fingerprint, event_type],
                      )?;
                  }
                  Err(error) => {
                      conn.execute(
                          "UPDATE responsibility_escalation_deliveries
                           SET status='failed',last_error=?,last_attempt_at=?
                           WHERE review_key=? AND fingerprint=? AND event_type=?",
                          params![error, now, review_key, fingerprint, event_type],
                      )?;
                  }
              }
              Ok(())
          }

          fn responsibility_escalation_deliveries(
              conn: &Connection,
              limit: i64,
          ) -> Result<Vec<ResponsibilityEscalationDelivery>> {
              let mut stmt = conn.prepare(
                  "SELECT d.id,d.project_id,d.repository_id,mr.repo,d.workflow_name,
                          d.review_key,d.fingerprint,d.event_type,d.escalation_level,d.sla_status,
                          d.reason,d.status,d.attempts,d.last_error,d.first_attempt_at,
                          d.last_attempt_at,d.emitted_at
                   FROM responsibility_escalation_deliveries d
                   JOIN monitored_repositories mr ON mr.id=d.repository_id
                   ORDER BY COALESCE(d.emitted_at,d.last_attempt_at) DESC,d.id DESC
                   LIMIT ?",
              )?;
              let rows = stmt.query_map(params![limit], |row| {
                  Ok(ResponsibilityEscalationDelivery {
                      id: row.get(0)?,
                      project_id: row.get(1)?,
                      repository_id: row.get(2)?,
                      repository: row.get(3)?,
                      workflow_name: row.get(4)?,
                      review_key: row.get(5)?,
                      fingerprint: row.get(6)?,
                      event_type: row.get(7)?,
                      escalation_level: row.get(8)?,
                      sla_status: row.get(9)?,
                      reason: row.get(10)?,
                      status: row.get(11)?,
                      attempts: row.get(12)?,
                      last_error: row.get(13)?,
                      first_attempt_at: row.get(14)?,
                      last_attempt_at: row.get(15)?,
                      emitted_at: row.get(16)?,
                  })
              })?;
              Ok(rows.collect::<rusqlite::Result<Vec<_>>>()?)
          }

          fn notify_responsibility_escalations(
              app: &AppHandle,
              conn: &Connection,
              now: DateTime<Utc>,
          ) -> Result<()> {
              let now_text = now.to_rfc3339();
              for drift in responsibility_map_drifts(conn)? {
                  let Some(event_type) = responsibility_escalation_event_type(&drift.escalation_level) else {
                      continue;
                  };
                  if !responsibility_source_synced(conn, drift.repository_id)? {
                      continue;
                  }
                  if !reserve_responsibility_escalation_delivery(conn, &drift, event_type, &now_text)? {
                      continue;
                  }
                  let title = format!(
                      "[Responsibility] {} — {}",
                      drift.escalation_level.to_uppercase(),
                      drift.workflow_name
                  );
                  let body = format!(
                      "{} · {} · {}",
                      drift.repository,
                      drift.review_priority.to_uppercase(),
                      drift.escalation_reason.as_deref().unwrap_or("Responsibility review escalation")
                  );
                  let result = app
                      .notification()
                      .builder()
                      .title(title)
                      .body(body)
                      .show()
                      .map_err(|error| error.to_string());
                  finish_responsibility_escalation_delivery(
                      conn,
                      &drift.review_key,
                      &drift.fingerprint,
                      event_type,
                      &now_text,
                      result,
                  )?;
              }
              Ok(())
          }

          fn notify_runs(""", "delivery functions")

          lib = replace_once(lib, """    let conn = db(state)?;
              notify_runs(app, &conn, &tracks, now)?;
              let dashboard = build_dashboard(state)?;""", """    let conn = db(state)?;
              notify_runs(app, &conn, &tracks, now)?;
              notify_responsibility_escalations(app, &conn, now)?;
              let dashboard = build_dashboard(state)?;""", "poll delivery")
          lib = lib.replace("ci-watchtower/0.3.26", "ci-watchtower/0.3.27")
          lib_path.write_text(lib)

          tests_path = Path("src-tauri/src/tests.rs")
          tests = tests_path.read_text()
          if "responsibility_escalation_delivery_is_deduplicated_and_retry_bounded" not in tests:
              tests += """

          #[test]
          fn responsibility_escalation_delivery_is_deduplicated_and_retry_bounded() {
              let path = legacy_v02_db_path("responsibility-escalation-delivery");
              init_db(&path).unwrap();
              let conn = Connection::open(&path).unwrap();
              let repository_id: i64 = conn.query_row(
                  "SELECT id FROM monitored_repositories WHERE repo='gycha0109-beep/K_beauty'",
                  [],
                  |row| row.get(0),
              ).unwrap();
              let project_id: i64 = conn.query_row(
                  "SELECT project_id FROM monitored_repositories WHERE id=?",
                  params![repository_id],
                  |row| row.get(0),
              ).unwrap();
              let drift = ResponsibilityMapDrift {
                  project_id,
                  repository_id,
                  repository: "gycha0109-beep/K_beauty".into(),
                  workflow_path: ".github/workflows/test.yml".into(),
                  workflow_name: "Test Responsibility".into(),
                  drift_type: "missing_in_watchtower".into(),
                  repository_binding: "dynamic".into(),
                  watchtower_binding: None,
                  expected_track_key: None,
                  actual_track_key: None,
                  source_path: RESPONSIBILITY_MAP_PATH.into(),
                  reason: "test".into(),
                  recommended_action: "review_add_dynamic_rule".into(),
                  review_key: "review-key".into(),
                  fingerprint: "fingerprint".into(),
                  review_status: "attention".into(),
                  review_priority: "p0".into(),
                  review_age_bucket: "fresh".into(),
                  review_age_hours: 0,
                  review_event_count: 0,
                  failed_attempt_count: 0,
                  last_reviewed_at: None,
                  first_seen_at: "2026-09-25T00:00:00Z".into(),
                  sla_status: "within_sla".into(),
                  sla_target_hours: Some(24),
                  sla_remaining_hours: Some(24),
                  escalation_level: "warning".into(),
                  escalation_reason: Some("test warning".into()),
              };
              assert_eq!(responsibility_escalation_event_type("warning"), Some("warning"));
              assert_eq!(responsibility_escalation_event_type("critical"), Some("critical"));
              assert_eq!(responsibility_escalation_event_type("none"), None);

              assert!(reserve_responsibility_escalation_delivery(&conn, &drift, "warning", "2026-09-25T00:00:00Z").unwrap());
              finish_responsibility_escalation_delivery(&conn, &drift.review_key, &drift.fingerprint, "warning", "2026-09-25T00:00:00Z", Ok(())).unwrap();
              assert!(!reserve_responsibility_escalation_delivery(&conn, &drift, "warning", "2026-09-25T00:01:00Z").unwrap());

              for minute in 2..=4 {
                  assert!(reserve_responsibility_escalation_delivery(
                      &conn,
                      &drift,
                      "critical",
                      &format!("2026-09-25T00:0{minute}:00Z"),
                  ).unwrap());
                  finish_responsibility_escalation_delivery(
                      &conn,
                      &drift.review_key,
                      &drift.fingerprint,
                      "critical",
                      &format!("2026-09-25T00:0{minute}:00Z"),
                      Err("delivery failed".into()),
                  ).unwrap();
              }
              assert!(!reserve_responsibility_escalation_delivery(&conn, &drift, "critical", "2026-09-25T00:05:00Z").unwrap());

              let deliveries = responsibility_escalation_deliveries(&conn, 10).unwrap();
              assert_eq!(deliveries.len(), 2);
              let warning = deliveries.iter().find(|item| item.event_type == "warning").unwrap();
              assert_eq!(warning.status, "emitted");
              assert_eq!(warning.attempts, 1);
              let critical = deliveries.iter().find(|item| item.event_type == "critical").unwrap();
              assert_eq!(critical.status, "failed");
              assert_eq!(critical.attempts, 3);

              drop(conn);
              let _ = std::fs::remove_file(&path);
              let _ = std::fs::remove_file(path.with_extension("sqlite3-wal"));
              let _ = std::fs::remove_file(path.with_extension("sqlite3-shm"));
          }
          """
          tests_path.write_text(tests)

          types_path = Path("src/types.ts")
          types = types_path.read_text()
          types = replace_once(types, """export interface ResponsibilityResolutionPreviewInput {""", """export interface ResponsibilityEscalationDelivery {
            id: number;
            projectId: number;
            repositoryId: number;
            repository: string;
            workflowName: string;
            reviewKey: string;
            fingerprint: string;
            eventType: 'warning' | 'critical' | string;
            escalationLevel: 'warning' | 'critical' | string;
            slaStatus: string;
            reason: string | null;
            status: 'pending' | 'emitted' | 'failed' | string;
            attempts: number;
            lastError: string | null;
            firstAttemptAt: string;
            lastAttemptAt: string;
            emittedAt: string | null;
          }

          export interface ResponsibilityResolutionPreviewInput {""", "delivery frontend type")
          types = replace_once(types, """  responsibilityMapSources: ResponsibilityMapSourceStatus[];
            projectRuns: WorkflowRunSummary[];""", """  responsibilityMapSources: ResponsibilityMapSourceStatus[];
            responsibilityEscalationDeliveries: ResponsibilityEscalationDelivery[];
            projectRuns: WorkflowRunSummary[];""", "dashboard frontend delivery field")
          types_path.write_text(types)

          app_path = Path("src/App.tsx")
          app = app_path.read_text()
          scope_anchor = """  const responsibilityMapSourcesInScope = useMemo(
              () => (dashboard?.responsibilityMapSources ?? []).filter(item =>
                (selectedProject === 'all' || item.projectId === selectedProject) &&
                (selectedRepository === 'all' || item.repositoryId === selectedRepository)
              ),
              [dashboard, selectedProject, selectedRepository],
            );"""
          app = replace_once(app, scope_anchor, scope_anchor + """
            const responsibilityEscalationDeliveriesInScope = useMemo(
              () => (dashboard?.responsibilityEscalationDeliveries ?? []).filter(item =>
                (selectedProject === 'all' || item.projectId === selectedProject) &&
                (selectedRepository === 'all' || item.repositoryId === selectedRepository)
              ),
              [dashboard, selectedProject, selectedRepository],
            );
            const responsibilityEscalationDeliveryByEvent = useMemo(() => {
              const map = new Map<string, typeof responsibilityEscalationDeliveriesInScope[number]>();
              for (const item of responsibilityEscalationDeliveriesInScope) {
                const key = item.reviewKey + ':' + item.fingerprint + ':' + item.eventType;
                if (!map.has(key)) map.set(key, item);
              }
              return map;
            }, [responsibilityEscalationDeliveriesInScope]);""", "delivery frontend scope")

          app = replace_once(app, """                    <span className={'responsibility-sla-badge ' + item.slaStatus}>
                                {responsibilitySlaLabel(item.slaStatus, item.slaRemainingHours)}
                              </span>
                              <small>{item.escalationReason ?? 'Review SLA escalation'}</small>""", """                    <span className={'responsibility-sla-badge ' + item.slaStatus}>
                                {responsibilitySlaLabel(item.slaStatus, item.slaRemainingHours)}
                              </span>
                              {(() => {
                                const delivery = responsibilityEscalationDeliveryByEvent.get(
                                  item.reviewKey + ':' + item.fingerprint + ':' + item.escalationLevel
                                );
                                return (
                                  <small className={'responsibility-delivery-state ' + (delivery?.status ?? 'pending')}>
                                    {delivery == null
                                      ? 'desktop pending'
                                      : delivery.status === 'emitted'
                                        ? 'desktop emitted · ' + formatAuditTime(delivery.emittedAt ?? delivery.lastAttemptAt)
                                        : 'desktop failed · attempt ' + delivery.attempts + '/3'}
                                  </small>
                                );
                              })()}
                              <small>{item.escalationReason ?? 'Review SLA escalation'}</small>""", "delivery row state")

          app = replace_once(app, """          )}
          {responsibilityMapSourceWarnings.length > 0 ? (""", """          )}
          {responsibilityEscalationDeliveriesInScope.length > 0 && (
                    <div className="responsibility-delivery-history">
                      <div className="responsibility-delivery-history-head">
                        <b>Desktop Escalation Delivery</b>
                        <small>fingerprint + event level 기준 중복 방지 · 실패 시 최대 3회 시도</small>
                      </div>
                      <div className="responsibility-delivery-history-list">
                        {responsibilityEscalationDeliveriesInScope.slice(0, 8).map(item => (
                          <div className="responsibility-delivery-history-row" key={'delivery:' + item.id}>
                            <span className={'responsibility-delivery-state ' + item.status}>{item.status.toUpperCase()}</span>
                            <span>
                              <b>{item.workflowName}</b>
                              <small>{item.repository} · {item.eventType.toUpperCase()} · attempt {item.attempts}</small>
                            </span>
                            <small>{formatAuditTime(item.emittedAt ?? item.lastAttemptAt)}</small>
                            <small>{item.lastError ?? item.reason ?? 'desktop notification accepted'}</small>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {responsibilityMapSourceWarnings.length > 0 ? (""", "delivery history panel")
          app_path.write_text(app)

          css_path = Path("src/styles.css")
          css = css_path.read_text()
          css = replace_once(css, """.responsibility-escalation-main small, .responsibility-escalation-row > small { color: #71809c; font-size: 9px; }
          .responsibility-review-buttons""", """.responsibility-escalation-main small, .responsibility-escalation-row > small { color: #71809c; font-size: 9px; }
          .responsibility-delivery-state { width: fit-content; font-size: 8px; font-weight: 900; letter-spacing: .04em; }
          .responsibility-delivery-state.emitted { color: #78d9aa; }
          .responsibility-delivery-state.failed { color: #ff8796; }
          .responsibility-delivery-state.pending { color: #f2c66b; }
          .responsibility-delivery-history { display: grid; gap: 7px; border: 1px solid #26344d; border-radius: 10px; background: #080e1a; padding: 10px; margin-bottom: 10px; }
          .responsibility-delivery-history-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
          .responsibility-delivery-history-head b { color: #cdd8ec; font-size: 10px; }
          .responsibility-delivery-history-head small { color: #697994; font-size: 9px; }
          .responsibility-delivery-history-list { display: grid; gap: 4px; }
          .responsibility-delivery-history-row { display: grid; grid-template-columns: 72px minmax(180px,1fr) 120px minmax(220px,1.3fr); gap: 8px; align-items: center; border-top: 1px solid #18233a; padding: 6px 2px 2px; }
          .responsibility-delivery-history-row > span:nth-child(2) { display: grid; gap: 2px; min-width: 0; }
          .responsibility-delivery-history-row b { color: #cdd8ec; font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .responsibility-delivery-history-row small { color: #71809c; font-size: 8px; }
          .responsibility-review-buttons""", "delivery styles")
          css_path.write_text(css)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          marker = "## Producer Contract Health"
          section = """### Responsibility Escalation Delivery (v0.3.27)

          SLA escalation을 WatchTower 내부 표시에서 데스크톱 알림 delivery까지 연결합니다.

          - 현재 repository responsibility source가 synced인 drift만 알림 대상으로 사용합니다. stale/error/pending source에서는 새 escalation 알림을 내보내지 않습니다.
          - WARNING과 CRITICAL을 별도 event level로 취급하며 review_key + fingerprint + event_type으로 영속 중복 방지합니다.
          - 같은 drift가 poll마다 반복되어도 이미 EMITTED된 event는 다시 보내지 않습니다. fingerprint가 바뀌면 새로운 review state이므로 새 알림이 가능합니다.
          - notification API 호출 실패는 FAILED로 기록하고 최대 3회까지 재시도합니다. 성공은 EMITTED로 기록합니다.
          - Dashboard의 Desktop Escalation Delivery에서 최근 delivery 상태, attempt 수, 오류/사유를 확인할 수 있습니다.
          - 이 계층은 관측/알림만 수행하며 Track, workflow rule, producer YAML, repository map, run assignment를 자동 변경하지 않습니다.

          """
          if "### Responsibility Escalation Delivery (v0.3.27)" not in readme:
              if marker not in readme:
                  raise SystemExit("README marker missing")
              readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)

          for path, old, new in [
              (Path("package.json"), '"version": "0.3.26"', '"version": "0.3.27"'),
              (Path("src-tauri/Cargo.toml"), 'version = "0.3.26"', 'version = "0.3.27"'),
              (Path("src-tauri/tauri.conf.json"), '"version": "0.3.26"', '"version": "0.3.27"'),
          ]:
              value = path.read_text()
              if old not in value:
                  raise SystemExit(f"{path}: version anchor missing")
              path.write_text(value.replace(old, new, 1))

          Path(".github/workflows/implement-responsibility-escalation-delivery.yml").unlink()
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: deliver responsibility escalation notifications"
          git push origin HEAD:feat/responsibility-escalation-delivery
