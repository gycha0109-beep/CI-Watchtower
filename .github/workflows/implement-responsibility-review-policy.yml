name: Implement Responsibility Review Policy
run-name: "[WT:ops] Implement Responsibility Review Policy"

on:
  push:
    branches:
      - feat/responsibility-review-policy
    paths:
      - .github/workflows/implement-responsibility-review-policy.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/responsibility-review-policy
          fetch-depth: 0

      - name: Apply project-scoped policy implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, got {count}")
              return text.replace(old, new, 1)

          lib_path = Path("src-tauri/src/lib.rs")
          lib = lib_path.read_text()

          lib = replace_once(
              lib,
              "const RESPONSIBILITY_ESCALATION_MAX_ATTEMPTS: i64 = 3;",
              """const RESPONSIBILITY_ESCALATION_MAX_ATTEMPTS: i64 = 3;
          const DEFAULT_RESPONSIBILITY_P0_TARGET_HOURS: i64 = 24;
          const DEFAULT_RESPONSIBILITY_P1_TARGET_HOURS: i64 = 96;
          const DEFAULT_RESPONSIBILITY_P2_TARGET_HOURS: i64 = 72;
          const DEFAULT_RESPONSIBILITY_P0_DUE_SOON_HOURS: i64 = 12;
          const DEFAULT_RESPONSIBILITY_P1_DUE_SOON_HOURS: i64 = 24;
          const DEFAULT_RESPONSIBILITY_P2_DUE_SOON_HOURS: i64 = 24;""",
              "policy constants",
          )

          settings_anchor = """struct Settings {
              queue_congestion_threshold: i64,
              active_poll_seconds: i64,
              idle_poll_seconds: i64,
              auto_archive_completed: bool,
          }

          #[derive(Debug, Clone, Serialize)]"""
          settings_replacement = """struct Settings {
              queue_congestion_threshold: i64,
              active_poll_seconds: i64,
              idle_poll_seconds: i64,
              auto_archive_completed: bool,
          }

          #[derive(Debug, Clone, Serialize, Deserialize)]
          #[serde(rename_all = "camelCase")]
          struct ResponsibilityReviewPolicy {
              project_id: i64,
              p0_target_hours: i64,
              p1_target_hours: i64,
              p2_target_hours: i64,
              p0_due_soon_hours: i64,
              p1_due_soon_hours: i64,
              p2_due_soon_hours: i64,
              notify_warning: bool,
              notify_critical: bool,
              updated_at: Option<String>,
          }

          #[derive(Debug, Clone, Serialize)]"""
          lib = replace_once(lib, settings_anchor, settings_replacement, "policy struct")

          schema_anchor = """        CREATE INDEX IF NOT EXISTS idx_responsibility_review_state_scope
                    ON responsibility_review_state(project_id, repository_id, last_seen_at DESC);

                  CREATE TABLE IF NOT EXISTS track_aliases ("""
          schema_replacement = """        CREATE INDEX IF NOT EXISTS idx_responsibility_review_state_scope
                    ON responsibility_review_state(project_id, repository_id, last_seen_at DESC);

                  CREATE TABLE IF NOT EXISTS responsibility_review_policies (
                    project_id INTEGER PRIMARY KEY REFERENCES projects(id) ON DELETE CASCADE,
                    p0_target_hours INTEGER NOT NULL CHECK(p0_target_hours > 0),
                    p1_target_hours INTEGER NOT NULL CHECK(p1_target_hours > 0),
                    p2_target_hours INTEGER NOT NULL CHECK(p2_target_hours > 0),
                    p0_due_soon_hours INTEGER NOT NULL CHECK(p0_due_soon_hours > 0),
                    p1_due_soon_hours INTEGER NOT NULL CHECK(p1_due_soon_hours > 0),
                    p2_due_soon_hours INTEGER NOT NULL CHECK(p2_due_soon_hours > 0),
                    notify_warning INTEGER NOT NULL DEFAULT 1,
                    notify_critical INTEGER NOT NULL DEFAULT 1,
                    updated_at TEXT NOT NULL
                  );

                  CREATE TABLE IF NOT EXISTS track_aliases ("""
          lib = replace_once(lib, schema_anchor, schema_replacement, "policy schema")

          dashboard_anchor = """    settings: Settings,
              projects: Vec<Project>,
              repositories: Vec<MonitoredRepository>,"""
          dashboard_replacement = """    settings: Settings,
              projects: Vec<Project>,
              responsibility_review_policies: Vec<ResponsibilityReviewPolicy>,
              repositories: Vec<MonitoredRepository>,"""
          lib = replace_once(lib, dashboard_anchor, dashboard_replacement, "dashboard policy field")

          build_anchor = """    let projects = list_projects(&conn, true)?;
              let repositories = list_repositories(&conn, false)?;"""
          build_replacement = """    let projects = list_projects(&conn, true)?;
              let responsibility_review_policies =
                  list_responsibility_review_policies(&conn, &projects)?;
              let repositories = list_repositories(&conn, false)?;"""
          lib = replace_once(lib, build_anchor, build_replacement, "dashboard policy load")

          value_anchor = """        settings,
                  projects,
                  repositories,"""
          value_replacement = """        settings,
                  projects,
                  responsibility_review_policies,
                  repositories,"""
          lib = replace_once(lib, value_anchor, value_replacement, "dashboard policy value")

          priority_start = lib.index("fn responsibility_review_priority(")
          priority_end = lib.index("fn responsibility_review_priority_rank(", priority_start)
          if priority_start < 0 or priority_end < 0:
              raise SystemExit("priority function range missing")
          policy_functions = """fn default_responsibility_review_policy(project_id: i64) -> ResponsibilityReviewPolicy {
              ResponsibilityReviewPolicy {
                  project_id,
                  p0_target_hours: DEFAULT_RESPONSIBILITY_P0_TARGET_HOURS,
                  p1_target_hours: DEFAULT_RESPONSIBILITY_P1_TARGET_HOURS,
                  p2_target_hours: DEFAULT_RESPONSIBILITY_P2_TARGET_HOURS,
                  p0_due_soon_hours: DEFAULT_RESPONSIBILITY_P0_DUE_SOON_HOURS,
                  p1_due_soon_hours: DEFAULT_RESPONSIBILITY_P1_DUE_SOON_HOURS,
                  p2_due_soon_hours: DEFAULT_RESPONSIBILITY_P2_DUE_SOON_HOURS,
                  notify_warning: true,
                  notify_critical: true,
                  updated_at: None,
              }
          }

          fn responsibility_review_policy(
              conn: &Connection,
              project_id: i64,
          ) -> Result<ResponsibilityReviewPolicy> {
              Ok(conn
                  .query_row(
                      "SELECT project_id,p0_target_hours,p1_target_hours,p2_target_hours,
                              p0_due_soon_hours,p1_due_soon_hours,p2_due_soon_hours,
                              notify_warning,notify_critical,updated_at
                       FROM responsibility_review_policies WHERE project_id=?",
                      params![project_id],
                      |row| {
                          Ok(ResponsibilityReviewPolicy {
                              project_id: row.get(0)?,
                              p0_target_hours: row.get(1)?,
                              p1_target_hours: row.get(2)?,
                              p2_target_hours: row.get(3)?,
                              p0_due_soon_hours: row.get(4)?,
                              p1_due_soon_hours: row.get(5)?,
                              p2_due_soon_hours: row.get(6)?,
                              notify_warning: row.get::<_, i64>(7)? != 0,
                              notify_critical: row.get::<_, i64>(8)? != 0,
                              updated_at: row.get(9)?,
                          })
                      },
                  )
                  .optional()?
                  .unwrap_or_else(|| default_responsibility_review_policy(project_id)))
          }

          fn list_responsibility_review_policies(
              conn: &Connection,
              projects: &[Project],
          ) -> Result<Vec<ResponsibilityReviewPolicy>> {
              projects
                  .iter()
                  .map(|project| responsibility_review_policy(conn, project.id))
                  .collect()
          }

          fn responsibility_review_priority(
              policy: &ResponsibilityReviewPolicy,
              status: &str,
              age_hours: i64,
          ) -> String {
              match status {
                  "attention" => "p0".into(),
                  "open" if age_hours >= policy.p2_target_hours => "p1".into(),
                  "open" => "p2".into(),
                  "deferred" => "p3".into(),
                  "blocked" => "blocked".into(),
                  _ => "p2".into(),
              }
          }

          """
          lib = lib[:priority_start] + policy_functions + lib[priority_end:]

          sla_start = lib.index("fn responsibility_review_sla(")
          sla_end = lib.index("fn responsibility_escalation_rank(", sla_start)
          if sla_start < 0 or sla_end < 0:
              raise SystemExit("sla function range missing")
          sla_function = """fn responsibility_review_sla(
              policy: &ResponsibilityReviewPolicy,
              priority: &str,
              age_hours: i64,
          ) -> (String, Option<i64>, Option<i64>, String, Option<String>) {
              let (target_hours, due_soon_hours) = match priority {
                  "p0" => (Some(policy.p0_target_hours), policy.p0_due_soon_hours),
                  "p1" => (Some(policy.p1_target_hours), policy.p1_due_soon_hours),
                  "p2" => (Some(policy.p2_target_hours), policy.p2_due_soon_hours),
                  "p3" | "blocked" => (None, 0),
                  _ => (None, 0),
              };
              let Some(target_hours) = target_hours else {
                  return ("exempt".into(), None, None, "none".into(), None);
              };
              let remaining = target_hours - age_hours;
              if remaining <= 0 {
                  let reason = match priority {
                      "p0" => format!(
                          "P0 attention drift exceeded the {}h review SLA by {}h.",
                          target_hours,
                          -remaining
                      ),
                      "p1" => format!(
                          "P1 aging drift exceeded the {}h review SLA by {}h.",
                          target_hours,
                          -remaining
                      ),
                      _ => format!("Review SLA exceeded by {}h.", -remaining),
                  };
                  return (
                      "breached".into(),
                      Some(target_hours),
                      Some(remaining),
                      if matches!(priority, "p0" | "p1") {
                          "critical".into()
                      } else {
                          "none".into()
                      },
                      Some(reason),
                  );
              }
              let status = if remaining <= due_soon_hours {
                  "due_soon"
              } else {
                  "within_sla"
              };
              let escalation_level = if matches!(priority, "p0" | "p1") {
                  "warning"
              } else {
                  "none"
              };
              let reason = match priority {
                  "p0" => Some(format!(
                      "P0 attention drift has {}h remaining before the {}h review SLA.",
                      remaining,
                      target_hours
                  )),
                  "p1" => Some(format!(
                      "P1 aging drift has {}h remaining before the {}h review SLA.",
                      remaining,
                      target_hours
                  )),
                  _ => None,
              };
              (
                  status.into(),
                  Some(target_hours),
                  Some(remaining),
                  escalation_level.into(),
                  reason,
              )
          }

          """
          lib = lib[:sla_start] + sla_function + lib[sla_end:]

          populate_anchor = """    drift.last_reviewed_at = last_reviewed_at;
              drift.review_priority = responsibility_review_priority(&drift.review_status, age_hours);
              let (sla_status, sla_target_hours, sla_remaining_hours, escalation_level, escalation_reason) =
                  responsibility_review_sla(&drift.review_priority, age_hours);"""
          populate_replacement = """    drift.last_reviewed_at = last_reviewed_at;
              let policy = responsibility_review_policy(conn, drift.project_id)?;
              drift.review_priority =
                  responsibility_review_priority(&policy, &drift.review_status, age_hours);
              let (sla_status, sla_target_hours, sla_remaining_hours, escalation_level, escalation_reason) =
                  responsibility_review_sla(&policy, &drift.review_priority, age_hours);"""
          lib = replace_once(lib, populate_anchor, populate_replacement, "policy SLA application")

          notify_anchor = """        let Some(event_type) = responsibility_escalation_event_type(&drift.escalation_level) else {
                      continue;
                  };
                  if !responsibility_source_synced(conn, drift.repository_id)? {
                      continue;
                  }"""
          notify_replacement = """        let Some(event_type) = responsibility_escalation_event_type(&drift.escalation_level) else {
                      continue;
                  };
                  let policy = responsibility_review_policy(conn, drift.project_id)?;
                  if (event_type == "warning" && !policy.notify_warning)
                      || (event_type == "critical" && !policy.notify_critical)
                  {
                      continue;
                  }
                  if !responsibility_source_synced(conn, drift.repository_id)? {
                      continue;
                  }"""
          lib = replace_once(lib, notify_anchor, notify_replacement, "notification policy gate")

          save_settings_anchor = """#[tauri::command]
          fn set_github_token(token: String) -> std::result::Result<(), String> {"""
          save_policy = """#[tauri::command]
          fn save_responsibility_review_policy(
              policy: ResponsibilityReviewPolicy,
              state: State<'_, AppState>,
          ) -> std::result::Result<(), String> {
              let targets = [
                  policy.p0_target_hours,
                  policy.p1_target_hours,
                  policy.p2_target_hours,
              ];
              if targets.iter().any(|value| *value < 1 || *value > 720) {
                  return Err("Responsibility SLA target은 1~720시간 사이여야 합니다.".into());
              }
              if policy.p1_target_hours <= policy.p2_target_hours {
                  return Err("P1 SLA target은 P2 SLA target보다 커야 합니다.".into());
              }
              for (due, target) in [
                  (policy.p0_due_soon_hours, policy.p0_target_hours),
                  (policy.p1_due_soon_hours, policy.p1_target_hours),
                  (policy.p2_due_soon_hours, policy.p2_target_hours),
              ] {
                  if due < 1 || due > target {
                      return Err("Due-soon 기준은 1시간 이상이며 해당 SLA target 이하여야 합니다.".into());
                  }
              }
              let conn = db(&state).map_err(|e| e.to_string())?;
              let project_exists: bool = conn
                  .query_row(
                      "SELECT EXISTS(SELECT 1 FROM projects WHERE id=? AND active=1)",
                      params![policy.project_id],
                      |row| Ok(row.get::<_, i64>(0)? != 0),
                  )
                  .map_err(|e| e.to_string())?;
              if !project_exists {
                  return Err("활성 Project를 찾을 수 없습니다.".into());
              }
              let now = Utc::now().to_rfc3339();
              conn.execute(
                  "INSERT INTO responsibility_review_policies(
                     project_id,p0_target_hours,p1_target_hours,p2_target_hours,
                     p0_due_soon_hours,p1_due_soon_hours,p2_due_soon_hours,
                     notify_warning,notify_critical,updated_at
                   ) VALUES(?,?,?,?,?,?,?,?,?,?)
                   ON CONFLICT(project_id) DO UPDATE SET
                     p0_target_hours=excluded.p0_target_hours,
                     p1_target_hours=excluded.p1_target_hours,
                     p2_target_hours=excluded.p2_target_hours,
                     p0_due_soon_hours=excluded.p0_due_soon_hours,
                     p1_due_soon_hours=excluded.p1_due_soon_hours,
                     p2_due_soon_hours=excluded.p2_due_soon_hours,
                     notify_warning=excluded.notify_warning,
                     notify_critical=excluded.notify_critical,
                     updated_at=excluded.updated_at",
                  params![
                      policy.project_id,
                      policy.p0_target_hours,
                      policy.p1_target_hours,
                      policy.p2_target_hours,
                      policy.p0_due_soon_hours,
                      policy.p1_due_soon_hours,
                      policy.p2_due_soon_hours,
                      if policy.notify_warning { 1 } else { 0 },
                      if policy.notify_critical { 1 } else { 0 },
                      now,
                  ],
              )
              .map(|_| ())
              .map_err(|e| e.to_string())
          }

          #[tauri::command]
          fn set_github_token(token: String) -> std::result::Result<(), String> {"""
          lib = replace_once(lib, save_settings_anchor, save_policy, "save policy command")

          handler_anchor = """            save_settings,
                      set_github_token,"""
          handler_replacement = """            save_settings,
                      save_responsibility_review_policy,
                      set_github_token,"""
          lib = replace_once(lib, handler_anchor, handler_replacement, "policy handler")

          lib = lib.replace("ci-watchtower/0.3.27", "ci-watchtower/0.3.28")
          lib_path.write_text(lib)

          tests_path = Path("src-tauri/src/tests.rs")
          tests = tests_path.read_text()
          tests = replace_once(
              tests,
              """fn responsibility_review_priority_and_age_bucket_follow_operational_order() {
              assert_eq!(responsibility_review_priority("attention", 0), "p0");
              assert_eq!(responsibility_review_priority("open", 72), "p1");
              assert_eq!(responsibility_review_priority("open", 71), "p2");""",
              """fn responsibility_review_priority_and_age_bucket_follow_operational_order() {
              let policy = default_responsibility_review_policy(1);
              assert_eq!(responsibility_review_priority(&policy, "attention", 0), "p0");
              assert_eq!(responsibility_review_priority(&policy, "open", 72), "p1");
              assert_eq!(responsibility_review_priority(&policy, "open", 71), "p2");""",
              "priority test signature",
          )
          tests = tests.replace('responsibility_review_priority("deferred", 120)', 'responsibility_review_priority(&policy, "deferred", 120)')
          tests = tests.replace('responsibility_review_priority("blocked", 120)', 'responsibility_review_priority(&policy, "blocked", 120)')

          sla_test_anchor = """fn responsibility_review_sla_escalates_p0_and_p1_without_escalating_p2() {
              let p0_fresh = responsibility_review_sla("p0", 0);"""
          sla_test_replacement = """fn responsibility_review_sla_escalates_p0_and_p1_without_escalating_p2() {
              let policy = default_responsibility_review_policy(1);
              let p0_fresh = responsibility_review_sla(&policy, "p0", 0);"""
          tests = replace_once(tests, sla_test_anchor, sla_test_replacement, "sla test signature")
          for old, new in [
              ('responsibility_review_sla("p0", 12)', 'responsibility_review_sla(&policy, "p0", 12)'),
              ('responsibility_review_sla("p0", 24)', 'responsibility_review_sla(&policy, "p0", 24)'),
              ('responsibility_review_sla("p1", 72)', 'responsibility_review_sla(&policy, "p1", 72)'),
              ('responsibility_review_sla("p1", 100)', 'responsibility_review_sla(&policy, "p1", 100)'),
              ('responsibility_review_sla("p2", 48)', 'responsibility_review_sla(&policy, "p2", 48)'),
              ('responsibility_review_sla("p3", 500)', 'responsibility_review_sla(&policy, "p3", 500)'),
          ]:
              tests = tests.replace(old, new)

          if "responsibility_review_policy_is_project_scoped_and_preserves_defaults" not in tests:
              tests += """

          #[test]
          fn responsibility_review_policy_is_project_scoped_and_preserves_defaults() {
              let path = legacy_v02_db_path("responsibility-review-policy");
              init_db(&path).unwrap();
              let conn = Connection::open(&path).unwrap();
              let visualy_project_id: i64 = conn.query_row(
                  "SELECT id FROM projects WHERE project_key='visualy'",
                  [],
                  |row| row.get(0),
              ).unwrap();
              let myeongha_project_id: i64 = conn.query_row(
                  "SELECT id FROM projects WHERE project_key='myeongha'",
                  [],
                  |row| row.get(0),
              ).unwrap();

              let visualy_default = responsibility_review_policy(&conn, visualy_project_id).unwrap();
              assert_eq!(visualy_default.p0_target_hours, 24);
              assert_eq!(visualy_default.p1_target_hours, 96);
              assert_eq!(visualy_default.p2_target_hours, 72);
              assert!(visualy_default.notify_warning);
              assert!(visualy_default.updated_at.is_none());

              conn.execute(
                  "INSERT INTO responsibility_review_policies(
                     project_id,p0_target_hours,p1_target_hours,p2_target_hours,
                     p0_due_soon_hours,p1_due_soon_hours,p2_due_soon_hours,
                     notify_warning,notify_critical,updated_at
                   ) VALUES(?,?,?,?,?,?,?,?,?,?)",
                  params![
                      visualy_project_id, 12, 120, 48, 6, 12, 12, 0, 1,
                      "2026-09-25T01:00:00Z"
                  ],
              ).unwrap();

              let visualy = responsibility_review_policy(&conn, visualy_project_id).unwrap();
              let myeongha = responsibility_review_policy(&conn, myeongha_project_id).unwrap();
              assert_eq!(visualy.p0_target_hours, 12);
              assert_eq!(visualy.p1_target_hours, 120);
              assert_eq!(visualy.p2_target_hours, 48);
              assert!(!visualy.notify_warning);
              assert!(visualy.notify_critical);
              assert_eq!(myeongha.p0_target_hours, 24);
              assert_eq!(myeongha.p2_target_hours, 72);
              assert!(myeongha.updated_at.is_none());

              assert_eq!(responsibility_review_priority(&visualy, "open", 47), "p2");
              assert_eq!(responsibility_review_priority(&visualy, "open", 48), "p1");
              let p0 = responsibility_review_sla(&visualy, "p0", 6);
              assert_eq!(p0.0, "due_soon");
              assert_eq!(p0.1, Some(12));
              assert_eq!(p0.2, Some(6));

              drop(conn);
              let _ = std::fs::remove_file(&path);
              let _ = std::fs::remove_file(path.with_extension("sqlite3-wal"));
              let _ = std::fs::remove_file(path.with_extension("sqlite3-shm"));
          }
          """
          tests_path.write_text(tests)

          types_path = Path("src/types.ts")
          types = types_path.read_text()
          types = replace_once(types, """export interface RepositoryScopeStats {""", """export interface ResponsibilityReviewPolicy {
            projectId: number;
            p0TargetHours: number;
            p1TargetHours: number;
            p2TargetHours: number;
            p0DueSoonHours: number;
            p1DueSoonHours: number;
            p2DueSoonHours: number;
            notifyWarning: boolean;
            notifyCritical: boolean;
            updatedAt: string | null;
          }

          export interface RepositoryScopeStats {""", "policy frontend type")
          types = replace_once(types, """  projects: Project[];
            repositories: MonitoredRepository[];""", """  projects: Project[];
            responsibilityReviewPolicies: ResponsibilityReviewPolicy[];
            repositories: MonitoredRepository[];""", "dashboard frontend policy")
          types_path.write_text(types)

          api_path = Path("src/api.ts")
          api = api_path.read_text()
          api = replace_once(api, """  ResponsibilityResolutionResult,
            RunAttributionDetail,""", """  ResponsibilityResolutionResult,
            ResponsibilityReviewPolicy,
            RunAttributionDetail,""", "api policy import")
          api = replace_once(api, """  saveSettings: (settings: Settings) => invoke<void>('save_settings', { settings }),
            setGithubToken:""", """  saveSettings: (settings: Settings) => invoke<void>('save_settings', { settings }),
            saveResponsibilityReviewPolicy: (policy: ResponsibilityReviewPolicy) =>
              invoke<void>('save_responsibility_review_policy', { policy }),
            setGithubToken:""", "api policy method")
          api_path.write_text(api)

          app_path = Path("src/App.tsx")
          app = app_path.read_text()
          app = replace_once(app, """  ResponsibilityResolutionPreview,
            RunAttributionDetail,""", """  ResponsibilityResolutionPreview,
            ResponsibilityReviewPolicy,
            RunAttributionDetail,""", "app policy import")

          selected_anchor = """  const selectedProjectId = typeof selectedProject === 'number'
              ? selectedProject
              : dashboard?.projects[0]?.id ?? 0;"""
          selected_replacement = selected_anchor + """
            const selectedResponsibilityPolicy = useMemo(
              () => typeof selectedProject === 'number'
                ? (dashboard?.responsibilityReviewPolicies ?? []).find(item => item.projectId === selectedProject) ?? null
                : null,
              [dashboard, selectedProject],
            );"""
          app = replace_once(app, selected_anchor, selected_replacement, "selected policy")

          update_anchor = """  const updateSettings = async (patch: Partial<Settings>) => {
              if (!dashboard) return;
              const next = { ...dashboard.settings, ...patch };
              await act(() => api.saveSettings(next));
            };"""
          update_replacement = update_anchor + """

            const updateResponsibilityPolicy = async (
              policy: ResponsibilityReviewPolicy,
              patch: Partial<ResponsibilityReviewPolicy>,
            ) => {
              const next = { ...policy, ...patch };
              await act(
                () => api.saveResponsibilityReviewPolicy(next),
                'Responsibility Review SLA 정책을 저장했습니다.',
              );
            };"""
          app = replace_once(app, update_anchor, update_replacement, "update policy helper")

          settings_anchor = """          {dashboard && <div className="stack-form">
                      <label>Queue 혼잡 경고 기준<input type="number" min="1" value={dashboard.settings.queueCongestionThreshold} onBlur={e => void updateSettings({ queueCongestionThreshold: Number(e.target.value) })} onChange={e => setDashboard({ ...dashboard, settings: { ...dashboard.settings, queueCongestionThreshold: Number(e.target.value) } })} /></label>
                      <label>활성 Polling(초)<input type="number" min="10" value={dashboard.settings.activePollSeconds} onBlur={e => void updateSettings({ activePollSeconds: Number(e.target.value) })} onChange={e => setDashboard({ ...dashboard, settings: { ...dashboard.settings, activePollSeconds: Number(e.target.value) } })} /></label>
                      <label>유휴 Polling(초)<input type="number" min="30" value={dashboard.settings.idlePollSeconds} onBlur={e => void updateSettings({ idlePollSeconds: Number(e.target.value) })} onChange={e => setDashboard({ ...dashboard, settings: { ...dashboard.settings, idlePollSeconds: Number(e.target.value) } })} /></label>
                    </div>}"""
          policy_editor = settings_anchor + """
                    <hr />
                    <h2>Responsibility Review SLA</h2>
                    {selectedResponsibilityPolicy ? (
                      <div className="stack-form responsibility-policy-editor" key={'policy:' + selectedResponsibilityPolicy.projectId + ':' + (selectedResponsibilityPolicy.updatedAt ?? 'default')}>
                        <small className="muted-copy">선택 Project에만 적용됩니다. 미설정 Project는 v0.3.27 기본값을 그대로 사용합니다.</small>
                        <div className="responsibility-policy-grid">
                          <label>P0 target(h)<input type="number" min="1" max="720" defaultValue={selectedResponsibilityPolicy.p0TargetHours} onBlur={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { p0TargetHours: Number(e.target.value) })} /></label>
                          <label>P0 due-soon(h)<input type="number" min="1" max="720" defaultValue={selectedResponsibilityPolicy.p0DueSoonHours} onBlur={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { p0DueSoonHours: Number(e.target.value) })} /></label>
                          <label>P1 target(h)<input type="number" min="1" max="720" defaultValue={selectedResponsibilityPolicy.p1TargetHours} onBlur={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { p1TargetHours: Number(e.target.value) })} /></label>
                          <label>P1 due-soon(h)<input type="number" min="1" max="720" defaultValue={selectedResponsibilityPolicy.p1DueSoonHours} onBlur={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { p1DueSoonHours: Number(e.target.value) })} /></label>
                          <label>P2 target(h)<input type="number" min="1" max="720" defaultValue={selectedResponsibilityPolicy.p2TargetHours} onBlur={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { p2TargetHours: Number(e.target.value) })} /></label>
                          <label>P2 due-soon(h)<input type="number" min="1" max="720" defaultValue={selectedResponsibilityPolicy.p2DueSoonHours} onBlur={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { p2DueSoonHours: Number(e.target.value) })} /></label>
                        </div>
                        <label className="responsibility-policy-toggle"><input type="checkbox" defaultChecked={selectedResponsibilityPolicy.notifyWarning} onChange={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { notifyWarning: e.target.checked })} /> WARNING desktop 알림</label>
                        <label className="responsibility-policy-toggle"><input type="checkbox" defaultChecked={selectedResponsibilityPolicy.notifyCritical} onChange={e => void updateResponsibilityPolicy(selectedResponsibilityPolicy, { notifyCritical: e.target.checked })} /> CRITICAL desktop 알림</label>
                      </div>
                    ) : (
                      <small className="muted-copy">Project를 하나 선택하면 해당 Project의 SLA/알림 정책을 편집할 수 있습니다.</small>
                    )}"""
          app = replace_once(app, settings_anchor, policy_editor, "policy editor")
          app_path.write_text(app)

          css_path = Path("src/styles.css")
          css = css_path.read_text()
          css += """
          .responsibility-policy-editor { gap: 8px; }
          .responsibility-policy-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
          .responsibility-policy-toggle { display: flex !important; flex-direction: row !important; align-items: center; gap: 7px; color: #9cabc4; }
          .responsibility-policy-toggle input { width: auto; }
          """
          css_path.write_text(css)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          marker = "## Producer Contract Health"
          section = """### Project-scoped Responsibility Review Policy (v0.3.28)

          Responsibility Review SLA와 desktop escalation delivery 정책을 Project 단위로 분리합니다.

          - 기본값은 v0.3.27과 동일한 P0 24h, P1 96h, P2 72h 및 due-soon 12h/24h/24h입니다.
          - Project별로 P0/P1/P2 target과 due-soon window를 저장할 수 있으며 다른 Project에는 전파되지 않습니다.
          - Open drift의 P1 승격 시점은 해당 Project의 P2 target을 사용합니다. P1 target은 P2 target보다 커야 합니다.
          - WARNING/CRITICAL desktop delivery를 Project별로 각각 켜고 끌 수 있습니다.
          - 정책이 저장되지 않은 Project는 default policy를 read-time fallback으로 사용하므로 기존 설치/DB migration에서 동작이 바뀌지 않습니다.
          - 정책 변경은 SLA 계산과 알림 delivery에만 영향을 주며 Track/Rule/producer/map/run assignment를 변경하지 않습니다.

          """
          if "### Project-scoped Responsibility Review Policy (v0.3.28)" not in readme:
              if marker not in readme:
                  raise SystemExit("README marker missing")
              readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)

          for path, old, new in [
              (Path("package.json"), '"version": "0.3.27"', '"version": "0.3.28"'),
              (Path("src-tauri/Cargo.toml"), 'version = "0.3.27"', 'version = "0.3.28"'),
              (Path("src-tauri/tauri.conf.json"), '"version": "0.3.27"', '"version": "0.3.28"'),
          ]:
              value = path.read_text()
              if old not in value:
                  raise SystemExit(f"{path}: version anchor missing")
              path.write_text(value.replace(old, new, 1))

          Path(".github/workflows/implement-responsibility-review-policy.yml").unlink()

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add project-scoped responsibility review policy"
          git push origin HEAD:feat/responsibility-review-policy
