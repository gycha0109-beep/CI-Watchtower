name: Fix Responsibility Aging Initializers

on:
  push:
    branches:
      - feat/responsibility-review-aging
    paths:
      - .github/workflows/fix-responsibility-aging-initializers.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/responsibility-review-aging
          fetch-depth: 0
      - name: Complete stale drift initializers
        shell: python
        run: |
          from pathlib import Path
          path = Path("src-tauri/src/lib.rs")
          source = path.read_text()
          old = """                    review_status: "open".into(),
                          });"""
          new = """                    review_status: "open".into(),
                              review_priority: "p2".into(),
                              review_age_bucket: "fresh".into(),
                              review_age_hours: 0,
                              review_event_count: 0,
                              failed_attempt_count: 0,
                              last_reviewed_at: None,
                              first_seen_at: String::new(),
                          });"""
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 stale drift initializers, got {count}")
          path.write_text(source.replace(old, new))
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit initializer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git commit -m "fix: initialize aging fields for stale responsibility drift"
          git push origin HEAD:feat/responsibility-review-aging
