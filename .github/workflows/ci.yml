name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build + tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python for preservation regression
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: SQLite preservation fixture tests
        run: python -m unittest discover -s tools -p 'test_verify_watchtower_db.py' -v

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend build
        run: npm run build

      - name: Rust Core independent tests
        run: cargo test --manifest-path src-tauri/crates/ci-core/Cargo.toml

      - name: Build headless CI inspector (preview)
        run: cargo build --manifest-path src-tauri/crates/ci-core/Cargo.toml --bin ci-core-inspect

      - name: Inspect headless CLI without credentials
        shell: pwsh
        run: |
          & .\src-tauri\crates\ci-core\target\debug\ci-core-inspect.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build read-only CI registry preview
        run: cargo build --manifest-path src-tauri/crates/ci-core/Cargo.toml --bin ci-core-registry

      - name: Inspect registry CLI without database
        shell: pwsh
        run: |
          & .\src-tauri\crates\ci-core\target\debug\ci-core-registry.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build read-only CI history preview
        run: cargo build --manifest-path src-tauri/crates/ci-core/Cargo.toml --bin ci-core-history

      - name: Inspect history CLI without database
        shell: pwsh
        run: |
          & .\src-tauri\crates\ci-core\target\debug\ci-core-history.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build bounded live CI scanner preview
        run: cargo build --manifest-path src-tauri/crates/ci-core/Cargo.toml --bin ci-core-scan

      - name: Inspect live scanner CLI without credentials
        shell: pwsh
        run: |
          & .\src-tauri\crates\ci-core\target\debug\ci-core-scan.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build isolated Core staging writer preview
        run: cargo build --manifest-path src-tauri/crates/ci-core/Cargo.toml --bin ci-core-stage

      - name: Inspect staging-only CLI without credentials
        shell: pwsh
        run: |
          & .\src-tauri\crates\ci-core\target\debug\ci-core-stage.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate Windows bridge smoke script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('tools/Test-WatchTowerBridge.ps1', 'tools/Test-WatchTowerPackagedExe.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          }


      - name: Execute bridge credential decoder regression
        shell: pwsh
        run: |
          & .\tools\Test-WatchTowerBridge.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate isolated Windows Credential Manager roundtrip
        shell: pwsh
        run: |
          & .\tools\Test-WatchTowerBridge.ps1 -Mode WindowsCanary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        run: npm run tauri build

      - name: Smoke actual packaged Windows EXE bridge lifecycle
        shell: pwsh
        run: |
          & .\tools\Test-WatchTowerPackagedExe.ps1 `
            -Executable 'src-tauri/target/release/ci-watchtower.exe' `
            -SmokeScript 'tools/Test-WatchTowerBridge.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload headless CI inspector preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-core-headless-preview
          path: |
            src-tauri/crates/ci-core/target/debug/ci-core-inspect.exe
            src-tauri/crates/ci-core/target/debug/ci-core-registry.exe
            src-tauri/crates/ci-core/target/debug/ci-core-history.exe
            src-tauri/crates/ci-core/target/debug/ci-core-scan.exe
            src-tauri/crates/ci-core/target/debug/ci-core-stage.exe
          if-no-files-found: error

      - name: Upload installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-watchtower-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/ci-watchtower.exe
          if-no-files-found: error
