[package]
name = "ci-watchtower-core"
version = "0.1.0"
edition = "2021"
description = "Reusable, UI-independent CI evidence decisions for WatchTower consumers"
publish = false

[dependencies]
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
